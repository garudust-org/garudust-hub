name: fetch_title
deprecated: true
deprecation_notice: "Use the fetch-title skill instead: `garudust skill install fetch-title`. The skill uses web_fetch with no uv or Python dependency."
description: Fetch the HTML title of a webpage from a given URL. Use when you need to identify or label a URL without reading its full content.
toolset: hub
destructive: false
requires: [uv]
schema:
  type: object
  properties:
    url:
      type: string
      description: Full URL of the webpage (e.g. "https://example.com")
  required: [url]
command: uv run --with httpx --with beautifulsoup4 ./run.py {url}
