name: read_qr
description: Decode a QR code from an image file. Use when the user provides an image containing a QR code and wants to know its content.
toolset: hub
destructive: false
schema:
  type: object
  properties:
    image_path:
      type: string
      description: Path to the image file containing the QR code (e.g. "/tmp/qr.png")
  required: [image_path]
requires: [zbarimg]
command: ./run.sh {image_path}
