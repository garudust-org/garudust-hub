name: token_count
description: Count characters, words, and estimated LLM tokens in a text file. Use before sending a file to an LLM to estimate cost or check whether it fits within a context limit.
toolset: hub
destructive: false
requires: [rustc]
schema:
  type: object
  properties:
    file_path:
      type: string
      description: Path to a plain text file (e.g. "/tmp/article.txt")
  required: [file_path]
command: ./run.sh {file_path}
