name: view_image
description: >
  Analyse an image and answer a question about it using a vision-capable LLM.
  Prefers Google Gemini Flash; falls back to OpenRouter free tier.
  Configure model and credentials in config.yaml under tools.view_image.
  Pass a local file path or a public URL.
  Use this tool whenever the user shares an image and asks what is in it,
  or when a task requires understanding image content.
toolset: hub
destructive: false
requires: [uv]
env_required: [GOOGLE_AI_API_KEY]
model: gemini-flash-latest
fallback_model: nvidia/nemotron-nano-12b-v2-vl:free
schema:
  type: object
  properties:
    source:
      type: string
      description: >
        Absolute local file path (e.g. /tmp/photo.jpg) or public image URL
        (https://…). Supported formats: JPEG, PNG, WEBP, GIF.
    question:
      type: string
      description: >
        What to ask about the image, e.g. "What objects are in this image?"
        Defaults to a general description if omitted.
  required: [source]
command: uv run --with httpx ./run.py {source} {question}
