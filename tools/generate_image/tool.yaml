name: generate_image
description: Generate an image from a text prompt using Ideogram.ai (V2 model). Use when the user wants to create an image for a post or social media content. Requires IDEOGRAM_API_KEY env var.
toolset: hub
destructive: false
requires: [uv]
schema:
  type: object
  properties:
    prompt:
      type: string
      description: Text description of the image to generate. Be specific about style, subject, and composition.
    output_path:
      type: string
      description: Absolute path where the generated image will be saved (e.g. /tmp/post_image.png)
    width:
      type: integer
      description: Image width in pixels (default 1200 — maps to nearest Ideogram aspect ratio)
    height:
      type: integer
      description: Image height in pixels (default 630 — maps to nearest Ideogram aspect ratio)
  required: [prompt, output_path]
command: uv run --with httpx ./run.py {prompt} {output_path} {width} {height}
