version: "1"
tools:
  - name: weather
    description: Get current weather for a city using wttr.in (no API key required)
    version: "1.0.0"
    files:
      - tool.yaml
      - run.sh

  - name: hash_text
    description: Compute the SHA-256 hash of a string
    version: "1.0.0"
    files:
      - tool.yaml

  - name: read_qr
    description: Decode a QR code from an image file
    version: "1.0.0"
    files:
      - tool.yaml
      - run.sh

  - name: csv_to_json
    description: Convert a CSV file to a JSON array of objects using the header row as keys
    version: "1.0.0"
    files:
      - tool.yaml
      - run.py

  - name: token_count
    description: Count characters, words, and estimated LLM tokens in a text file
    version: "1.0.0"
    files:
      - tool.yaml
      - run.sh
      - main.rs

  - name: fetch_title
    description: Fetch the HTML title of a webpage from a given URL
    version: "1.0.0"
    files:
      - tool.yaml
      - run.py

  - name: markdown_to_html
    description: Convert a Markdown file to HTML with support for tables, strikethrough, and task lists
    version: "1.0.0"
    files:
      - tool.yaml
      - run.sh
      - Cargo.toml
      - src/main.rs

  - name: yaml_to_json
    description: Convert a YAML file to formatted JSON output
    version: "1.0.0"
    files:
      - tool.yaml
      - run.sh
      - index.js
      - package.json

  - name: file_info
    description: Return metadata for a file — size, MIME type, encoding, line and word count
    version: "1.0.0"
    files:
      - tool.yaml
      - run.py

  - name: extract_urls
    description: Extract all URLs from an HTML or plain text file
    version: "1.0.0"
    files:
      - tool.yaml
      - run.py

  - name: facebook_post
    description: Post text or a photo with caption to a Facebook Page via Graph API
    version: "1.0.0"
    files:
      - tool.yaml
      - run.py

  - name: generate_image
    description: Generate an image from a text prompt using Hugging Face Inference API (FLUX.1-schnell, free tier, requires HF_TOKEN)
    version: "2.0.0"
    files:
      - tool.yaml
      - run.py

  - name: view_image
    description: Analyse an image (local file or URL) with a free vision LLM and answer questions about it. Supports provider profiles via GARUDUST_API_KEY; falls back to GOOGLE_AI_API_KEY / OPENROUTER_API_KEY.
    version: "1.2.0"
    files:
      - tool.yaml
      - run.py

  - name: tts
    description: Convert text to a speech audio file (Thai TTS). Requires a provider profile with GARUDUST_BASE_URL and GARUDUST_API_KEY (e.g. iApp TTS v3). Speaker and speed configurable via TTS_SPEAKER_ID and TTS_SPEED in .env.
    version: "1.0.0"
    files:
      - tool.yaml
      - run.py

  - name: email_send
    description: Send email via Resend API or SMTP. Auto-detects provider from env — RESEND_API_KEY for Resend, SMTP_HOST for SMTP.
    version: "1.0.0"
    files:
      - tool.yaml
      - run.py

  - name: github_ops
    description: GitHub API operations — create PR, list issues, comment, merge, close issue. Requires GITHUB_TOKEN.
    version: "1.0.0"
    files:
      - tool.yaml
      - run.py

  - name: line_oa
    description: LINE Official Account — push/broadcast/reply/multicast messages (text, image, sticker, flex) and get user profile. Requires LINE_CHANNEL_ACCESS_TOKEN.
    version: "1.0.0"
    files:
      - tool.yaml
      - run.py

skills:
  - name: git-workflow
    description: Conventional commits, branch naming, and PR best practices for every git operation
    version: "1.0.0"
    files:
      - SKILL.md
      - scripts/check-commit-msg.sh

  - name: code-review
    description: Systematic checklist for reviewing pull requests — correctness, security, readability, and tests
    version: "1.0.0"
    files:
      - SKILL.md

  - name: log-analyst
    description: Analyse log files to find error patterns, detect anomalies, trace requests, and summarise incidents — works on any log format
    version: "1.2.0"
    files:
      - SKILL.md

  - name: facebook-workflow
    description: Research a topic, write a Facebook post, generate a matching image, and publish to a Page — full automated workflow
    version: "1.5.0"
    files:
      - SKILL.md
