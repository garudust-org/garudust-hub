name: Bug Report
description: Report a broken or misbehaving tool
labels: ["bug"]
body:
  - type: input
    id: tool_name
    attributes:
      label: Tool name
      placeholder: e.g. weather
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Describe the issue. Include the input you used and the output you got.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. macOS 14, Ubuntu 22.04
